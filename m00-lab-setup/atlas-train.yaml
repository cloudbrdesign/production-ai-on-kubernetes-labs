# Stand-in for Atlas training: a Job that runs to completion.
apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-train
  namespace: atlas
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: atlas-train
        team: credit
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: busybox:1.37
        command: ["sh", "-c", "for e in 1 2 3 4 5; do echo training epoch $e of 5; sleep 2; done; echo model saved"]
