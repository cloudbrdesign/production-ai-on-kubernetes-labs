# Stand-in for Sentinel scoring: a Deployment of three Pods behind a Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-scoring
  namespace: sentinel
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinel-scoring
  template:
    metadata:
      labels:
        app: sentinel-scoring
        team: fraud
    spec:
      containers:
      - name: scoring
        image: nginx:1.29
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-scoring
  namespace: sentinel
spec:
  selector:
    app: sentinel-scoring
  ports:
  - port: 80
    targetPort: 80
